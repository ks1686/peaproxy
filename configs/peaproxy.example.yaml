# PeaProxy example config (schemaVersion 1)
#
# Copy to ~/.config/peaproxy/config.yaml or pass --config.
# First `peaproxy serve` writes this skeleton if the file is missing.
# File mode should stay 0600. Prefer apiKeyEnv over inline apiKey.
# OAuth tokens and inline apiKey are stored in the OS keychain (or
# secrets.enc next to this file), not as plaintext in YAML.
#
# Override order: config file < PEAPROXY_* env < CLI flags.
# See docs/CONFIG.md.

schemaVersion: 1
bind: 127.0.0.1
port: 8317
allowNonLoopback: false
# Opt-in redacted JSONL next to this file (requests.log). usage.json is always written.
requestLog: false

hide:
  providers: []
  models: []
  # Listing-only by default (CPA #5995). Set true to also refuse POST routing.
  blockRouting: false
expose:
  models: []

# Stable route names. Clients send the local name; PeaProxy rewrites model to
# the live catalog id. Pin and rename stay listing-only.
# routes:
#   code: llama3.2

# Optional overlays. Live ListModels remains the source of IDs.
# catalog:
#   pin:
#     - llama3.2
#   rename:
#     llama3.2: Llama 3.2 local

# Matching accounts for a model. Empty / omitted policy is round-robin.
# fill-first: always start at the first hot account in YAML order.
# sticky: keep the last successful account for that model until it cools or fails.
# adaptive: prefer lower in-flight, then fewer errors, then lower latency.
failover:
  policy: round-robin
  # sessionAffinity defaults on. Set false to rotate every request.
  # sessionAffinityTTL: 1h

# requestEngine and automaticRoutes are omitted by default.
# promptCache stays preserve, response cache stays off, and pea/* routes stay disabled.
# See docs/V2.md.

providers:
  - id: ollama-local
    adapter: ollama
    tier: local
    baseURL: http://127.0.0.1:11434/v1

  # Local LM Studio OpenAI server (first-class adapter; default http://127.0.0.1:1234/v1).
  # - id: lmstudio-local
  #   adapter: lmstudio
  #   tier: local

  # Local llama.cpp llama-server (default http://127.0.0.1:8080/v1).
  # - id: llamacpp-local
  #   adapter: llamacpp
  #   tier: local

  # Jan desktop Local API Server (default http://127.0.0.1:1337/v1).
  # - id: jan-local
  #   adapter: jan
  #   tier: local

  # GPT4All desktop local API (default http://127.0.0.1:4891/v1).
  # - id: gpt4all-local
  #   adapter: gpt4all
  #   tier: local

  # Local vLLM OpenAI-compat server (default http://127.0.0.1:8000/v1).
  # - id: vllm-local
  #   adapter: vllm
  #   tier: local

  # Groq (OpenAI-compat).
  # - id: groq
  #   adapter: groq
  #   tier: freemium
  #   apiKeyEnv: GROQ_API_KEY

  # Cerebras (OpenAI-compat).
  # - id: cerebras
  #   adapter: cerebras
  #   tier: freemium
  #   apiKeyEnv: CEREBRAS_API_KEY

  # Google AI Studio via official Gemini OpenAI-compat endpoint
  # (https://ai.google.dev/gemini-api/docs/openai). Not generateContent.
  # Adapter alias: gemini
  # - id: google-key
  #   adapter: google
  #   tier: freemium
  #   apiKeyEnv: GEMINI_API_KEY

  # xAI Grok (OpenAI-compat).
  # - id: xai-key
  #   adapter: xai
  #   tier: paid
  #   apiKeyEnv: XAI_API_KEY

  # Hugging Face Inference Providers router (OpenAI-compat).
  # - id: huggingface
  #   adapter: huggingface
  #   tier: freemium
  #   apiKeyEnv: HF_TOKEN

  # NVIDIA API catalog / hosted NIM (OpenAI-compat). Key from build.nvidia.com.
  # - id: nim-key
  #   adapter: nim
  #   tier: freemium
  #   apiKeyEnv: NVIDIA_API_KEY

  # Cloudflare Workers AI OpenAI-compat. Paste the account id, or set
  # CLOUDFLARE_ACCOUNT_ID so YOUR_ACCOUNT_ID is replaced at add/runtime.
  # - id: workers-ai
  #   adapter: workers_ai
  #   tier: freemium
  #   baseURL: https://api.cloudflare.com/client/v4/accounts/YOUR_ACCOUNT_ID/ai/v1
  #   apiKeyEnv: CLOUDFLARE_API_TOKEN

  # SambaNova Cloud OpenAI-compat (https://api.sambanova.ai/v1).
  # - id: sambanova-key
  #   adapter: sambanova
  #   tier: freemium
  #   apiKeyEnv: SAMBANOVA_API_KEY

  # Ollama Cloud (hosted OpenAI-compat at ollama.com/v1 — not local :11434).
  # - id: ollama-cloud
  #   adapter: ollama_cloud
  #   tier: freemium
  #   apiKeyEnv: OLLAMA_API_KEY

  # - id: openrouter
  #   adapter: openrouter
  #   tier: freemium
  #   baseURL: https://openrouter.ai/api/v1
  #   apiKeyEnv: OPENROUTER_API_KEY

  # Native Anthropic Messages API (x-api-key). Also bridges OpenAI chat/completions.
  # - id: anthropic-key
  #   adapter: anthropic
  #   tier: paid
  #   apiKeyEnv: ANTHROPIC_API_KEY

  # Native OpenAI API (Bearer). Models + chat completions stream.
  # - id: openai-key
  #   adapter: openai
  #   tier: paid
  #   apiKeyEnv: OPENAI_API_KEY

  # OpenCode Zen (CPA declined #6018). Official key from opencode.ai.
  # Free models may train on prompts — see docs/PROVIDERS.md.
  # - id: opencode-zen
  #   adapter: opencode_zen
  #   tier: free
  #   baseURL: https://opencode.ai/zen/v1
  #   apiKeyEnv: OPENCODE_API_KEY

  # OpenCode Go subscription (distinct from Zen). Official key from opencode.ai/auth.
  # - id: opencode-go
  #   adapter: opencode_go
  #   tier: paid
  #   baseURL: https://opencode.ai/zen/go/v1
  #   apiKeyEnv: OPENCODE_API_KEY

  # Claude Pro/Max subscription OAuth. ToS/ban risk — docs/OAUTH.md.
  # peaproxy auth login --provider anthropic
  # Tokens are stored in the OS keychain / secrets.enc, not in this YAML.
  # - id: anthropic-oauth
  #   adapter: anthropic_oauth
  #   tier: paid
  #   oauth:
  #     email: (written by auth login)

  # ChatGPT/Codex subscription OAuth. ToS/ban risk — docs/OAUTH.md.
  # peaproxy auth login --provider openai
  # - id: openai-oauth
  #   adapter: openai_oauth
  #   tier: paid

  # Gemini / Antigravity consumer OAuth (distinct from AI Studio keys). ToS/ban risk.
  # peaproxy auth login --provider gemini
  # - id: antigravity
  #   adapter: antigravity
  #   tier: paid

  # xAI Grok subscription device OAuth. ToS/ban risk. Prefer adapter xai + XAI_API_KEY.
  # peaproxy auth login --provider xai
  # - id: xai-oauth
  #   adapter: xai_oauth
  #   tier: paid

  # Kimi / Meta Muse: peaproxy auth login --provider kimi|kimi-ai|meta (ToS/ban risk).
  # GitHub Copilot: peaproxy auth login --provider copilot (ToS/ban risk; not GitHub Models).
  # Qwen consumer OAuth is not yet (no CPA flow); use openai_compat + a Qwen key.
  # Factory/Droid chat upstream is not yet; point Droid at PeaProxy (peaproxy clients show droid).
