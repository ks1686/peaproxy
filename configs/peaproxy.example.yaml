# PeaProxy example config (schemaVersion 1)
#
# Copy to peaproxy.yaml (gitignored). Secrets belong in the OS keychain or
# environment variables — not in this file.

schemaVersion: 1
bind: 127.0.0.1
port: 8317
# Non-loopback bind (0.0.0.0 / LAN) requires both of these:
allowNonLoopback: false
# adminToken: ""

hide:
  providers: []
  models: []
expose:
  # Empty = all non-hidden models are visible to /v1/models.
  models: []

providers:
  - id: ollama-local
    adapter: ollama
    tier: local
    baseURL: http://127.0.0.1:11434/v1

  # Generic OpenAI-compatible (LM Studio, llama.cpp, Groq, OpenRouter, …)
  # - id: lmstudio-local
  #   adapter: openai_compat
  #   tier: local
  #   baseURL: http://127.0.0.1:1234/v1

  # - id: openrouter
  #   adapter: openai_compat
  #   tier: free
  #   baseURL: https://openrouter.ai/api/v1
  #   apiKeyEnv: OPENROUTER_API_KEY

  # OAuth stubs — not implemented. Do not expect login to work.
  # - id: anthropic-oauth
