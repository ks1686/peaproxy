name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          PEAPROXY_SECRET_BACKEND: file
        run: go test ./...
      - name: Build
        run: go build ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race
        env:
          PEAPROXY_SECRET_BACKEND: file
        run: go test -race ./internal/gateway ./internal/router ./internal/responsecache ./internal/oauth ./internal/streamguard ./internal/server
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install Playwright
        run: npm ci --prefix scripts && npx --prefix scripts playwright install --with-deps chromium
      - name: UI smoke
        env:
          PEAPROXY_SECRET_BACKEND: file
        run: node scripts/v2-ui-smoke.mjs
